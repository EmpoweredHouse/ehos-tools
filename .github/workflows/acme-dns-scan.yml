# The acme-dns image that installations run, scanned every week (#822, #829; T-24). Installations
# with public certificates run it as a DNS server on the internet (eh-os D-158), and they run the
# index `EhosPlatform.PublicCertificates` pins by digest, which `acme-dns.yml` scanned only when it
# was published. Trivy's database moves on after that, so this scans the pinned digest again, for
# both architectures, every Monday, by hand, and on a pull request that moves the pin. A change
# to this file alone does not start it, so that its result is always about a pin: try one by hand
# from `main` once it lands.
#
# On `main`, an advisory rated HIGH or CRITICAL that has a fix opens one issue, or comments on the
# one already open, with what Trivy found and how the pin moves. A clean run closes that issue. The
# scanner runs from its image by digest, as the runner's user with no capabilities, in a container
# that sees only Docker's credentials and its output, in a job that can only read the image; the
# job that writes the issue runs no scanner.
name: acme-dns scan

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [packages/ehos_platform/lib/ehos_platform/public_certificates.ex]

permissions: {}

concurrency:
  group: acme-dns-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIN_FILE: packages/ehos_platform/lib/ehos_platform/public_certificates.ex
  TITLE: "acme-dns's pinned image has advisories with a fix"
  # Trivy by the digest of its image, which `.github/renovate.json5` moves.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  pin:
    name: Read the pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ env.PIN_FILE }}
          sparse-checkout-cone-mode: false

      # Exactly one line `@acme_dns_image "…"`, held to an image by digest before anything uses
      # it: what reaches the output, the registry's credentials and the issue is that one line.
      - id: read
        name: Read the pinned digest
        run: |
          image=$(sed -n 's/^ *@acme_dns_image "\(.*\)"$/\1/p' "$PIN_FILE")
          if [ "$(printf '%s\n' "$image" | wc -l)" -ne 1 ] ||
             ! printf '%s' "$image" | grep -Eqx 'ghcr\.io/empoweredhouse/acme-dns@sha256:[0-9a-f]{64}'; then
            echo "::error file=$PIN_FILE::no single @acme_dns_image naming ghcr.io/empoweredhouse/acme-dns by digest"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Scanning \`$image\`." >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan it (${{ matrix.platform }})
    needs: pin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read # pulls the index
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      # Docker's credentials, which Trivy offers to ghcr.io alone, where a copy of its database
      # also lives; TRIVY_PASSWORD would go to every registry it reads, mirror.gcr.io included.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A scan that fails to run fails this step; one that runs writes what it found, and the
      # steps below tell an advisory from an error.
      - name: Scan the pinned digest
        env:
          PINNED: ${{ needs.pin.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e DOCKER_CONFIG=/docker \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "${DOCKER_CONFIG:-$HOME/.docker}/config.json:/docker/config.json:ro" \
            -v "$PWD:/out" \
            "$TRIVY_IMAGE" image --image-src remote --platform "$PLATFORM" \
            --severity HIGH,CRITICAL --ignore-unfixed --format json --output /out/trivy.json \
            "$PINNED"

      # One line per advisory, under the platform's name, for the log and the issue.
      - id: found
        name: List what it found
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          {
            echo "$PLATFORM: $count"
            jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? |
              "\(.VulnerabilityID) \(.Severity) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) (\($t)): \(.Title // "")"' trivy.json
          } > found.txt
          cat found.txt
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Keep the list for the issue
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: found-${{ strategy.job-index }}
          path: found.txt
          retention-days: 30

      - name: Fail on an advisory with a fix
        if: steps.found.outputs.count != '0'
        env:
          COUNT: ${{ steps.found.outputs.count }}
        run: |
          echo "::error::$COUNT HIGH or CRITICAL advisories with a fix"
          exit 1

  report:
    name: Open or close the issue
    needs: [pin, scan]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.pin.result == 'success' && (needs.scan.result == 'success' || needs.scan.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: found-*
          path: reports

      # Both lists, or nothing: a scan that did not run says nothing of the image, and its run is
      # already red.
      - name: Write the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.pin.outputs.image }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          reports=(reports/*/found.txt)
          if [ "${#reports[@]}" -ne 2 ]; then
            echo "::error::a scan did not run; no issue is written"
            exit 1
          fi
          total=0
          for report in "${reports[@]}"; do
            total=$((total + $(head -n 1 "$report" | sed 's/.*: //')))
          done

          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")

          if [ "$total" -eq 0 ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The pinned image \`$IMAGE\` has no HIGH or CRITICAL advisory with a fix any more: $RUN"
            fi
            exit 0
          fi

          {
            echo "The weekly scan found HIGH or CRITICAL advisories with a fix in the acme-dns image the installer pins:"
            echo
            echo "\`$IMAGE\` ([run]($RUN))"
            echo
            # A fence of tildes no advisory's title closes.
            echo '~~~~~~~~ text'
            for report in "${reports[@]}"; do
              head -c 25000 "$report" | tr -d '~'
              echo
            done
            echo '~~~~~~~~'
            echo
            echo "## How the pin moves"
            echo
            echo "1. The fix reaches the image's source, \`packaging/acme-dns/Dockerfile\`: a newer Go or Alpine digest, a newer acme-dns tag, or a newer \`X_NET_VERSION\`. Renovate opens that pull request on its next run (T-24); open it by hand if it has not."
            echo "2. Merging it publishes a new index: the \`acme-dns image\` workflow on \`main\` scans it by digest for both architectures and tags it \`latest\` once both are clean."
            echo "3. \`@acme_dns_image\` in \`$PIN_FILE\` moves to that digest by a pull request: Renovate opens it on its next run, or at once with \`gh workflow run Renovate\`. This workflow scans the new pin on that pull request."
            echo "4. \`ehos_platform\` and \`ehosctl\` are released with it. An installation takes the new image when it is installed again with that \`ehosctl\`."
            echo
            echo "This issue closes itself when the weekly scan of the pin is clean."
          } > body.md

          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
