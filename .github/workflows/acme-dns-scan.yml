# The acme-dns image that installations run, scanned every week (#822, #829; T-24). Installations
# with public certificates run it as a DNS server on the internet (eh-os D-158), and they run the
# index `EhosPlatform.PublicCertificates` pins by digest, which `acme-dns.yml` scanned only when it
# was published. Trivy's database moves on after that, so this scans the pinned digest again, for
# both architectures, every Monday, by hand, and on a pull request that moves the pin. A change
# to this file alone does not start it, so that its result is always about a pin: try one by hand
# from `main` once it lands.
#
# On `main`, an advisory rated HIGH or CRITICAL that has a fix opens one issue, or comments on the
# one already open, with what Trivy found and how the pin moves. A clean run closes that issue. The
# scanner, which downloads its own code and database, runs in a job that can only read the image;
# the job that writes the issue runs no scanner.
name: acme-dns scan

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [packages/ehos_platform/lib/ehos_platform/public_certificates.ex]

permissions: {}

concurrency:
  group: acme-dns-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIN_FILE: packages/ehos_platform/lib/ehos_platform/public_certificates.ex
  TITLE: "acme-dns's pinned image has advisories with a fix"

jobs:
  pin:
    name: Read the pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ env.PIN_FILE }}
          sparse-checkout-cone-mode: false

      # The one `@acme_dns_image` attribute, held to an image by digest before anything uses it.
      - id: read
        name: Read the pinned digest
        run: |
          image=$(sed -n 's/^ *@acme_dns_image "\(.*\)"$/\1/p' "$PIN_FILE")
          if ! printf '%s' "$image" | grep -Eqx 'ghcr\.io/empoweredhouse/acme-dns@sha256:[0-9a-f]{64}'; then
            echo "::error file=$PIN_FILE::@acme_dns_image is not ghcr.io/empoweredhouse/acme-dns by digest: '$image'"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Scanning \`$image\`." >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan it (${{ matrix.platform }})
    needs: pin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read # pulls the index
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Scan the pinned digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: ${{ matrix.platform }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.pin.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy.txt

      - name: Show what it found
        if: always()
        run: cat trivy.txt 2>/dev/null || true

      - name: Keep the report for the issue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ strategy.job-index }}
          path: trivy.txt
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: Open or close the issue
    needs: [pin, scan]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.pin.result == 'success' && (needs.scan.result == 'success' || needs.scan.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trivy-*
          path: reports

      - name: Write the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.pin.outputs.image }}
          RESULT: ${{ needs.scan.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")

          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The pinned image \`$IMAGE\` has no HIGH or CRITICAL advisory with a fix any more: $RUN"
            fi
            exit 0
          fi

          {
            echo "The weekly scan found HIGH or CRITICAL advisories with a fix in the acme-dns image the installer pins:"
            echo
            echo "\`$IMAGE\` ([run]($RUN))"
            echo
            for report in reports/*/trivy.txt; do
              echo '```text'
              head -c 25000 "$report"
              echo '```'
            done
            echo
            echo "## How the pin moves"
            echo
            echo "1. The fix reaches the image's source, \`packaging/acme-dns/Dockerfile\`: a newer Go or Alpine digest, a newer acme-dns tag, or a newer Go module in its \`go get\` line. Renovate opens that pull request on its own once one is released (T-24); open it by hand if it has not."
            echo "2. Merging it publishes a new index: the \`acme-dns image\` workflow on \`main\` names its digest in its summary, and its job \"Scan the published index\" must be green for both architectures."
            echo "3. \`@acme_dns_image\` in \`$PIN_FILE\` moves to that digest by a pull request (Renovate's, or by hand). This workflow scans the new pin on that pull request."
            echo "4. \`ehos_platform\` and \`ehosctl\` are released with it. An installation takes the new image when it is installed again with that \`ehosctl\`."
            echo
            echo "This issue closes itself when the weekly scan of the pin is clean."
          } > body.md

          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
