# Renovate, run here rather than as the hosted app (T-24): it opens the pull requests that keep
# acme-dns's image and the installer's pin of it current (#829), as `.github/renovate.json5` says,
# and keeps its Dependency Dashboard issue. This workflow's cron sets when it runs, every Monday;
# run it by hand (`gh workflow run Renovate`) after `acme-dns image` publishes from `main`, and it
# opens the pull request that moves the pin at once. Not on `workflow_run`, which would let a run
# started from another branch start this one.
#
# It writes through a token the *ehos-tools Renovate* GitHub App mints for this job: installed on
# ehos-tools alone, with contents, pull requests, issues and workflows. A pull request opened with
# the job's own GITHUB_TOKEN would start no workflow, so CI would not run on it. The App's Client
# ID and key are the secrets RENOVATE_APP_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY of the `renovate`
# environment, whose deployment branches are `main` alone, so a workflow on another branch cannot
# read them. Renovate reads the private image in GHCR with the job's own GITHUB_TOKEN, which can
# only read packages.
name: Renovate

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    if: github.ref == 'refs/heads/main'
    environment: renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: read # reads acme-dns's tags and digests in GHCR
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ehos-tools
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app.outputs.token }}
          # Renovate's image by digest: it runs with the App's token.
          renovate-version: 44.225.1@sha256:eec896cbc3a745b5144c1547360e8197efcd0f949a688a8a63605ee4db8590d0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits through GitHub's API, so GitHub signs them as the App's.
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_HOST_RULES: >-
            [{"matchHost": "ghcr.io", "hostType": "docker",
              "username": "${{ github.actor }}", "password": "${{ github.token }}"}]
