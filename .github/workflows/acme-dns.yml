# eh-os D-158 (eh-os#1236): acme-dns's image for amd64 and arm64, which its project does not
# publish, built from `packaging/acme-dns/Dockerfile`. A pull request that changes it builds both
# and scans them; a push of such a change to `main`, or a run by hand there, publishes one index
# over both to `ghcr.io/empoweredhouse/acme-dns`, tagged with acme-dns's version and the commit it
# was built from. `ehos_platform`'s installer pins the index by digest, so a publish changes
# nothing until a pull request moves the pin.
#
# The Dockerfile cross-compiles on the runner's own platform and its last stage runs nothing, so
# one runner builds both architectures without emulation. Two jobs, so that the token that can
# write to the registry is never present while the scanner, which downloads its own code and
# database, runs.
name: acme-dns image

on:
  pull_request:
    paths: ["packaging/acme-dns/**", ".github/workflows/acme-dns.yml"]
  push:
    branches: [main]
    paths: ["packaging/acme-dns/**", ".github/workflows/acme-dns.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: acme-dns-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/empoweredhouse/acme-dns
  # The tag of acme-dns that `ACME_DNS_COMMIT` in the Dockerfile names.
  VERSION: v2.0.2

jobs:
  build:
    name: Build and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/amd64,linux/arm64
          build-args: ACME_DNS_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=acme-dns
          cache-to: type=gha,scope=acme-dns,mode=max

      # The amd64 image from the same cache, into the runner's Docker for the scan. The arm64 one
      # holds the same Go modules and the same Alpine packages, from the same base index.
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/amd64
          build-args: ACME_DNS_VERSION=${{ env.VERSION }}
          load: true
          tags: acme-dns:scan
          cache-from: type=gha,scope=acme-dns

      - name: Scan it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: acme-dns:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # pushes the index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One index over both, from the layers Build and scan cached, with its SBOM and build
      # provenance in the registry (a GitHub attestation needs GitHub Enterprise Cloud on a
      # private repository). Its digest is what the installer pins; the runtime picks the image
      # that matches the node.
      - id: push
        name: Publish both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/amd64,linux/arm64
          build-args: ACME_DNS_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=acme-dns

      - name: Say the digest to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "### acme-dns $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin \`$IMAGE@$DIGEST\` in \`EhosPlatform.Install\`." >> "$GITHUB_STEP_SUMMARY"
