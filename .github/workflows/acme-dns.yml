# eh-os D-158 (eh-os#1236): acme-dns's image for amd64 and arm64, which its project does not
# publish, built from `packaging/acme-dns/Dockerfile`. A pull request that changes it builds both
# and scans each; a push of such a change to `main`, or a run by hand there, publishes one index
# over both to `ghcr.io/empoweredhouse/acme-dns`, tagged with acme-dns's version and the commit it
# was built from, and then scans that index by its digest for both architectures, so the image
# scanned is the image published (#822), and tags it `latest` once both are clean.
# `ehos_platform`'s installer pins the index by digest, so a publish changes nothing until a pull
# request moves the pin; `acme-dns-scan.yml` scans the pinned digest every week.
#
# The Dockerfile cross-compiles on the runner's own platform and its last stage runs nothing, so
# one runner builds both architectures without emulation. The token that can write to the
# registry is never present while the scanner runs. Trivy runs from its image by digest, as the
# runner's user with no capabilities, in a container that sees what it scans and, for a scan of
# the registry, Docker's credentials for ghcr.io, read-only; `publish` builds without the Actions
# cache, so nothing a job on `main` writes there reaches the published image (#876).
name: acme-dns image

on:
  pull_request:
    paths: ["packaging/acme-dns/**", ".github/workflows/acme-dns.yml"]
  # A change to the image's source publishes it; a change to this file alone does not, since every
  # publish gives a new digest for the pin to move to. A run by hand on `main` publishes.
  push:
    branches: [main]
    paths: ["packaging/acme-dns/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: acme-dns-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/empoweredhouse/acme-dns
  # Trivy by the digest of its image, which `.github/renovate.json5` moves.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  build:
    name: Build and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit by the digest of its image, not the moving `buildx-stable-1` it starts by default.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Build both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=acme-dns
          cache-to: type=gha,scope=acme-dns,mode=max

      # Each architecture from the same cache, as an OCI layout of its own that Trivy reads as files
      # (`--input`), not through Docker's image store: a runner's Docker cannot always hand Trivy an
      # image of another architecture, and Trivy ignores `--platform` for a layout, so one layout
      # holds one image. Both scans share one download of Trivy's database, in `runner.temp`.
      - name: Write the amd64 image as an OCI layout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/acme-dns-amd64,tar=false
          cache-from: type=gha,scope=acme-dns

      - name: Scan the amd64 image
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$RUNNER_TEMP/acme-dns-amd64:/scan:ro" -v "$RUNNER_TEMP/trivy-cache:/cache" \
            "$TRIVY_IMAGE" image --cache-dir /cache --input /scan \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Write the arm64 image as an OCI layout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/acme-dns-arm64,tar=false
          cache-from: type=gha,scope=acme-dns

      - name: Scan the arm64 image
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$RUNNER_TEMP/acme-dns-arm64:/scan:ro" -v "$RUNNER_TEMP/trivy-cache:/cache" \
            "$TRIVY_IMAGE" image --cache-dir /cache --input /scan \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  publish:
    name: Publish
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # pushes the index
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit by the digest of its image, not the moving `buildx-stable-1` it starts by default.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      # acme-dns's tag, from the Dockerfile, where Renovate moves it with its commit (T-24).
      - id: version
        name: Read acme-dns's version
        run: |
          version=$(sed -n 's/^ARG ACME_DNS_VERSION=\(v[0-9][0-9A-Za-z.+-]*\)$/\1/p' packaging/acme-dns/Dockerfile)
          if [ -z "$version" ]; then
            echo "::error file=packaging/acme-dns/Dockerfile::no ARG ACME_DNS_VERSION=v<version>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One index over both, built again from the source with no cache, since any job on `main`
      # can write the Actions cache (#876), with its SBOM and build provenance in the registry (a
      # GitHub attestation needs GitHub Enterprise Cloud on a private repository). Its digest is
      # what the installer pins, and `scan-published` scans it; the runtime picks the image that
      # matches the node.
      - id: push
        name: Publish both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          no-cache: true

      - name: Say how the pin moves
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### acme-dns $VERSION"
            echo "Published \`$IMAGE@$DIGEST\`. Once it is scanned clean for both architectures it is"
            echo "tagged \`latest\`, and \`gh workflow run Renovate\` opens the pull request that moves"
            echo "the pin in \`EhosPlatform.PublicCertificates\`; the weekly run does it otherwise."
          } >> "$GITHUB_STEP_SUMMARY"

  # The index just published, by its digest, for each architecture: what the installer will pull.
  # The job reads the registry and nothing else.
  scan-published:
    name: Scan the published index (${{ matrix.platform }})
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read # pulls the index
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      # Docker's credentials, which Trivy offers to ghcr.io alone, where a copy of its database
      # also lives; TRIVY_PASSWORD would go to every registry it reads, mirror.gcr.io included.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The container sees Docker's credentials, read-only, and nothing else of the runner.
      - name: Scan it
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e DOCKER_CONFIG=/docker \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "${DOCKER_CONFIG:-$HOME/.docker}/config.json:/docker/config.json:ro" \
            "$TRIVY_IMAGE" image --image-src remote --platform "$PLATFORM" \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE@$DIGEST"

  # `latest`, which Renovate follows to move the installer's pin (T-24), moves to the index only
  # once both architectures are scanned clean, from a job that runs no scanner.
  tag-latest:
    name: Tag it latest
    needs: [publish, scan-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write # moves the tag
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner's own buildx; `imagetools` talks to the registry and starts no builder. With
      # one source, it copies the index as it is, so `latest` names the digest scanned. A run
      # again of an older run's job moves `latest` back: the pin's pull request shows that.
      - name: Tag the scanned index latest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
