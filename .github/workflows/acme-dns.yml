# eh-os D-158 (eh-os#1236): acme-dns's image for amd64 and arm64, which its project does not
# publish, built from `packaging/acme-dns/Dockerfile`. A pull request that changes it builds both
# and scans each; a push of such a change to `main`, or a run by hand there, publishes one index
# over both to `ghcr.io/empoweredhouse/acme-dns`, tagged with acme-dns's version and the commit it
# was built from, and then scans that index by its digest for both architectures, so the image
# scanned is the image published (#822). `ehos_platform`'s installer pins the index by digest, so
# a publish changes nothing until a pull request moves the pin; `acme-dns-scan.yml` scans the
# pinned digest every week.
#
# The Dockerfile cross-compiles on the runner's own platform and its last stage runs nothing, so
# one runner builds both architectures without emulation. The token that can write to the
# registry is never present while the scanner, which downloads its own code and database, runs.
name: acme-dns image

on:
  pull_request:
    paths: ["packaging/acme-dns/**", ".github/workflows/acme-dns.yml"]
  push:
    branches: [main]
    paths: ["packaging/acme-dns/**", ".github/workflows/acme-dns.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: acme-dns-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/empoweredhouse/acme-dns
  # The tag of acme-dns that `ACME_DNS_COMMIT` in the Dockerfile names.
  VERSION: v2.0.2

jobs:
  build:
    name: Build and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit by the digest of its image, not the moving `buildx-stable-1` it starts by default.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Build both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/amd64,linux/arm64
          build-args: ACME_DNS_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=acme-dns
          cache-to: type=gha,scope=acme-dns,mode=max

      # Each architecture from the same cache, as an OCI layout of its own that Trivy reads with no
      # Docker: a runner's Docker cannot always hand Trivy an image of another architecture, and
      # Trivy ignores `--platform` for a layout, so one layout holds one image.
      - name: Write the amd64 image as an OCI layout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/amd64
          build-args: ACME_DNS_VERSION=${{ env.VERSION }}
          outputs: type=oci,dest=${{ runner.temp }}/acme-dns-amd64,tar=false
          cache-from: type=gha,scope=acme-dns

      - name: Scan the amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/acme-dns-amd64
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Write the arm64 image as an OCI layout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/arm64
          build-args: ACME_DNS_VERSION=${{ env.VERSION }}
          outputs: type=oci,dest=${{ runner.temp }}/acme-dns-arm64,tar=false
          cache-from: type=gha,scope=acme-dns

      - name: Scan the arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/acme-dns-arm64
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # pushes the index
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit by the digest of its image, not the moving `buildx-stable-1` it starts by default.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One index over both, from the layers Build and scan cached, with its SBOM and build
      # provenance in the registry (a GitHub attestation needs GitHub Enterprise Cloud on a
      # private repository). Its digest is what the installer pins; the runtime picks the image
      # that matches the node.
      - id: push
        name: Publish both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/acme-dns
          platforms: linux/amd64,linux/arm64
          build-args: ACME_DNS_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=acme-dns

      - name: Say the digest to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "### acme-dns $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`$IMAGE@$DIGEST\`. Pin it in \`EhosPlatform.PublicCertificates\` once Scan the published index is green." >> "$GITHUB_STEP_SUMMARY"

  # The index just published, by its digest, for each architecture: what the installer will pull.
  # The job reads the registry and nothing else.
  scan-published:
    name: Scan the published index (${{ matrix.platform }})
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read # pulls the index
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Scan it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: ${{ matrix.platform }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
