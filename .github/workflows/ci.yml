# What each job proves is described in CONTRIBUTING.md ("CI"). In short: every package a pull
# request touches passes its gate, and a pull request that changes `ehosctl`'s code or build has
# a Linux runner cross-build the four binaries. On a `v*` tag, or when run by hand, every package
# passes its gate, the binaries are built, and each one generates a project that passes its own
# checks on the platform it was built for. A tag then publishes the binaries, with its section of
# `packages/ehosctl/CHANGELOG.md` as the notes and `release.json` beside them (eh-os D-91), and
# installs them back through mise, the way the README tells people to. `e2e` waits for a tag
# because macOS runners cost ten times as much as Linux ones, and the rest runs only where
# something changed (docs/adr/0004-ci-runs-only-what-a-change-or-a-release-needs.md).
name: CI

on:
  push:
    # A merged pull request has passed CI already. `main` runs it again only when a lock file or
    # a toolchain changes, to save the caches that later pull requests restore: a pull request
    # reads the caches of `main` and its own, never another pull request's. GitHub ignores
    # `paths` for a tag, so every `v*` tag runs.
    branches: [main]
    tags: ["v*"]
    paths: ["**/mix.lock", "**/.tool-versions"]
  pull_request:
  # Builds the binaries and runs `e2e` on any branch, to try a change before it is tagged. On
  # `main` (`gh workflow run CI --ref main`), `release` also writes into its summary what a
  # release of that commit would publish, with `## [Unreleased]` as the notes (or, on a release's
  # merged pull request, its version's section), and publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event too, so a push to `main` never replaces a run started there by hand.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages a pull request touches, as a JSON list for `check`'s matrix. Anything else
  # checks them all. A package also depends on what its tests read outside it: the root
  # `.tool-versions` and the template's `ci.yml.eex` (`Ehosctl.TemplateTest`), `packaging/`
  # (`Ehosctl.TargetsTest`), `changelog.yml` (`Ehosctl.BuildPathsTest`), `.gitattributes`
  # (`EhosDesignTest`), `ehos_design`'s fonts
  # (`EhosApp.InstallTest`), `ehos_design`'s `priv/`, whose tokens, outcome, layer and fonts
  # `ehosctl` builds its sign-in page from (`Ehosctl.SignIn.Page`), and `ehos_design`'s tokens
  # and fonts, which `ehos_diagrams` draws eh-os's diagrams in (`EhosDiagrams.EhOsTest`).
  # This workflow is in every list, since it decides how they all run.
  #
  # And whether a pull request changes what goes into a binary, so that `build`, which is
  # Linux alone and cheap, proves it before a tag does. `e2e` still waits for the tag.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ github.event_name == 'pull_request' && steps.filter.outputs.changes || '["ehosctl","ehos_app","ehos_design","ehos_diagrams","ehos_platform","review"]' }}
      build: ${{ steps.build.outputs.build }}
    steps:
      # On a pull request it lists the changed files through the API, with no checkout.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ehosctl:
              - packages/ehosctl/**
              # A path dependency, compiled in: a change to what ehosctl calls of it fails
              # ehosctl's compile, tests or Dialyzer, not ehos_platform's. Its priv/ holds the
              # manifests ehosctl's install applies.
              - packages/ehos_platform/lib/**
              - packages/ehos_platform/priv/**
              - packages/ehos_platform/mix.exs
              - packages/ehos_design/priv/**
              - packages/ehos_app/priv/templates/ehos_app.install/ci.yml.eex
              # Its `hex_audit/1`, whose Hex minimum Ehosctl.VerifyTest holds `verify` to.
              - packages/ehos_app/lib/mix/tasks/ehos_app.install.ex
              # Its `ehosctl_code`, which Ehosctl.BuildPathsTest holds to ci.yml's `build`.
              - .github/workflows/changelog.yml
              - packaging/**
              - .tool-versions
              - .credo.exs
              # The repository's test support, compiled into each package's tests and read by
              # every package's Credo (ehos-tools#690).
              - test/support/**
              - .github/workflows/ci.yml
            ehos_app:
              - packages/ehos_app/**
              - packages/ehos_design/priv/static/**
              - .tool-versions
              - .credo.exs
              - test/support/**
              - .github/workflows/ci.yml
            ehos_design:
              - packages/ehos_design/**
              - .gitattributes
              - .tool-versions
              - .credo.exs
              - test/support/**
              - .github/workflows/ci.yml
            ehos_diagrams:
              - packages/ehos_diagrams/**
              - packages/ehos_design/priv/css/colors_and_type.css
              - packages/ehos_design/priv/static/ehos_design/fonts/**
              - .tool-versions
              - .credo.exs
              - test/support/**
              - .github/workflows/ci.yml
            ehos_platform:
              - packages/ehos_platform/**
              - .tool-versions
              - .credo.exs
              - test/support/**
              - .github/workflows/ci.yml
            review:
              - packages/review/**
              # ProcedureTest reads both plugins' copies of pre-pr-review's procedure.
              - plugins/*/skills/pre-pr-review/references/procedure.md
              # The gate is ehos_app's EhosApp.Review (T-17), and compiles with all of its
              # lib/, without the optional Igniter.
              - packages/ehos_app/lib/**
              - packages/ehos_app/mix.exs
              - .tool-versions
              - .credo.exs
              - test/support/**
              - .github/workflows/ci.yml
      # A step of its own, or its name would join `check`'s matrix. changelog.yml's
      # `ehosctl_code` is this list but for ci.yml; `Ehosctl.BuildPathsTest` holds the two equal.
      - id: build
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - packages/ehosctl/lib/**
              - packages/ehosctl/config/**
              - packages/ehosctl/rel/**
              - packages/ehosctl/mix.exs
              - packages/ehosctl/mix.lock
              - packages/ehosctl/.tool-versions
              # A path dependency, compiled into the binary with the manifests in its priv/.
              - packages/ehos_platform/lib/**
              - packages/ehos_platform/priv/**
              - packages/ehos_platform/mix.exs
              # What Ehosctl.SignIn.Page inlines into the binary.
              - packages/ehos_design/priv/css/colors_and_type.css
              - packages/ehos_design/priv/css/components/outcome.css
              - packages/ehos_design/priv/css/ehos_design.css
              - packages/ehos_design/priv/static/ehos_design/fonts/albert-sans-latin-400-normal.woff2
              - packages/ehos_design/priv/static/ehos_design/fonts/albert-sans-latin-500-normal.woff2
              - packages/ehos_design/priv/static/ehos_design/fonts/jetbrains-mono-latin-400-normal.woff2
              - .github/workflows/ci.yml

  check:
    name: check (${{ matrix.package }})
    needs: changes
    # A pull request that changes only documentation checks no package.
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    # The slowest package takes about 3 minutes with its cache. Without one (a changed toolchain,
    # or the account's cache egress run out, as on October 30, 2026) it builds every dependency
    # and Dialyzer's PLT, and the same work has taken twice as long on one runner as on another.
    # ehos_app's tests are not here but in `test-ehos-app`, below; with them, this job took up to
    # 24 minutes (#662).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      # All of history and the tags, for ehosctl alone: `Ehosctl.TemplateTest` checks the
      # template's pinned commit against ehos_app's release tag and its `mix.exs` there, and the
      # pinned ehosctl's refusal of a job's token against the template's CI. ehos_app's tests,
      # which read its tags too, run in `test-ehos-app`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.package == 'ehosctl' && '0' || '1' }}
          persist-credentials: false
      # Each package's toolchain: `packages/ehosctl/.tool-versions` for the CLI, the root
      # one for the template, the design system and the review gate.
      - uses: jdx/mise-action@v4
        with:
          working_directory: packages/${{ matrix.package }}
      # `test-ehos-app` restores ehos_app's under the same key and paths, copied there.
      - uses: actions/cache@v6
        with:
          path: |
            packages/${{ matrix.package }}/deps
            packages/${{ matrix.package }}/_build
          key: check-${{ matrix.package }}-${{ hashFiles('.tool-versions', format('packages/{0}/.tool-versions', matrix.package)) }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}
          # A changed lock file starts from the last cache under the same toolchain, and Mix
          # rebuilds what changed. A changed toolchain starts from nothing.
          restore-keys: check-${{ matrix.package }}-${{ hashFiles('.tool-versions', format('packages/{0}/.tool-versions', matrix.package)) }}-
      # ehos_design's browser test drives a page with Playwright, which needs Node, and the
      # browser it downloads, cached by the version its lock file pins.
      - if: matrix.package == 'ehos_design'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: matrix.package == 'ehos_design'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ehos_design/test/browser/package-lock.json') }}
      # `--force` without `--if-missing`: the check's audit needs Hex 2.6.0 or later.
      - run: mix local.hex --force
      - run: mix deps.get
      - if: matrix.package == 'ehos_design'
        run: mix browser.setup
      # ehos_app's gate without its tests, which `test-ehos-app` runs.
      - run: mix ${{ matrix.package == 'ehos_app' && 'check.static' || 'check' }}
      # T-11: the commit ehos_app's installer pins is the one eh-os-contract's release tag names.
      # eh-os-contract is private: the ehos-tools CI GitHub App mints a token that may only read
      # it, and expires within the hour. Git reads it from this step's environment alone, which
      # runs ehos_app's own test of the pin.
      - if: matrix.package == 'ehos_app'
        id: eh-os-contract
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EHOS_CI_APP_ID }}
          private-key: ${{ secrets.EHOS_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: eh-os-contract
          permission-contents: read
      - if: matrix.package == 'ehos_app'
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.eh-os-contract.outputs.token }}@github.com/EmpoweredHouse/eh-os-contract.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/EmpoweredHouse/eh-os-contract
        run: mix test --only eh_os_contract

  # ehos_app's tests, the rest of its `mix check`, in six jobs. Each installer test runs the
  # installer on a fresh test project, and one module's tests run one after another: in one job
  # on a two-core runner they made `check (ehos_app)` take up to 24 minutes. `--partitions` deals
  # the test files, sorted by path, round-robin, so the parts are not equal: on November 1, 2026
  # the largest held about a quarter of the suite's time, and a new test file moves those after
  # it. A part's time is in its job; more parts, or parts dealt by measured time, come next if
  # one runs far longer than the others.
  test-ehos-app:
    name: test (ehos_app, ${{ matrix.partition }}/6)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.packages), 'ehos_app')
    runs-on: ubuntu-24.04
    # As `check`'s: a part takes minutes with the cache, and without one builds every dependency.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: packages/ehos_app
    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: ${{ matrix.partition }}
    steps:
      # All of history and the tags: ehos_app's CI test checks the workflow every `ehos_app-v*`
      # tag wrote is one it replaces.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          working_directory: packages/ehos_app
      # `check (ehos_app)`'s cache, read and never written: that job saves it.
      - uses: actions/cache/restore@v6
        with:
          path: |
            packages/ehos_app/deps
            packages/ehos_app/_build
          key: check-ehos_app-${{ hashFiles('.tool-versions', 'packages/ehos_app/.tool-versions') }}-${{ hashFiles('packages/ehos_app/mix.lock') }}
          restore-keys: check-ehos_app-${{ hashFiles('.tool-versions', 'packages/ehos_app/.tool-versions') }}-
      - run: mix local.hex --force --if-missing
      - run: mix deps.get
      - run: mix test --warnings-as-errors --partitions 6

  # One job for the four targets: most of a build is setting up the toolchain and the
  # dependencies, which one job does once. Without `BURRITO_TARGET`, Burrito builds every target
  # in `mix.exs`; it takes one target there, never a list.
  build:
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: prod
    defaults:
      run:
        working-directory: packages/ehosctl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          working_directory: packages/ehosctl
          # On a tag the binaries are the release's, built with a toolchain installed now, never
          # one restored from a cache another run wrote (zizmor's cache-poisoning).
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # Burrito 1.6.0 refuses any Zig but 0.16.0. xz, which it also needs, is on the image.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: mix local.hex --force --if-missing
      - run: mix deps.get --only prod
      # Cross-built: the macOS targets too come from this Linux host.
      - run: mix release
      # What the release says about itself, written here from the code these binaries were
      # built from, so `release` needs no Elixir of its own and cannot describe another build.
      - run: mix ehosctl.release_file --commit "$GITHUB_SHA" --output burrito_out/release.json
      # Every binary `mix.exs` names, in one artifact, so a new target needs no new step here.
      - uses: actions/upload-artifact@v7
        with:
          name: ehosctl
          path: |
            packages/ehosctl/burrito_out/ehosctl_*
            packages/ehosctl/burrito_out/release.json
          if-no-files-found: error
          # Read by this run's `e2e`, `release` and `publish` alone. A week, not a few days, so
          # that a release waiting for approval in the environment `release` does not outlive
          # the binaries it publishes.
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.target }})
    needs: build
    # A pull request may build, but only a tag or a run started by hand goes on to `e2e`.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    # The slowest, macOS x64, has taken up to 19 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: macos_arm64 }
          - { runner: macos-15-intel, target: macos_x64 }
          - { runner: ubuntu-24.04, target: linux_x64 }
          - { runner: ubuntu-24.04-arm, target: linux_arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ehosctl
          path: ${{ runner.temp }}/bin
      - name: Put the binary for this platform on the path, as `ehosctl`
        run: |
          mv "$RUNNER_TEMP/bin/ehosctl_${{ matrix.target }}" "$RUNNER_TEMP/bin/ehosctl"
          chmod +x "$RUNNER_TEMP/bin/ehosctl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Only mise itself, as a developer would have it: `ehosctl init` installs the pinned
      # Erlang and Elixir through it.
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: false
      # Only Hex's download cache. Erlang, Elixir and the generator's archives are left
      # uncached on purpose: installing them on a clean machine is part of what this job
      # proves, and it is where a Linux-only bug in `mise exec` was found.
      - uses: actions/cache@v6
        with:
          path: ~/.hex/packages
          key: hex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ehos_app/lib/**', 'packages/ehosctl/lib/ehosctl/template.ex') }}
          restore-keys: hex-${{ runner.os }}-${{ runner.arch }}-
      - uses: ikalnytskyi/action-setup-postgres@v8
      # `ehosctl init` makes the project's first commit.
      - run: git config --global user.name "ehos-tools CI" && git config --global user.email "ci@ehos-tools.invalid"
      # Git's own default branch, as on most Linux distributions, so that the check after `init`
      # fails on every runner if the project's first commit is left to git (#190).
      - run: git config --global init.defaultBranch master
      - run: ehosctl --version
      - run: ehosctl init --help
      # `eh-os-contract` is private, and so is this repository, which the generated project
      # reads `ehos_design` from. The ehos-tools CI GitHub App mints a token that can only
      # read those two repositories, and expires within the hour.
      - id: private-deps
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EHOS_CI_APP_ID }}
          private-key: ${{ secrets.EHOS_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: eh-os-contract,ehos-tools
          permission-contents: read
      # Outside the checkout, so the repository's own `.tool-versions` plays no part.
      - name: ehosctl init shop
        working-directory: ${{ runner.temp }}
        env:
          EHOSCTL_TEMPLATE_SOURCE: path:${{ github.workspace }}/packages/ehos_app
          # mise fetches Erlang builds from GitHub on macOS; a token keeps it off the
          # anonymous rate limit. Set on this step only: the later ones compile
          # third-party Hex packages, whose code has no business with it.
          MISE_GITHUB_TOKEN: ${{ github.token }}
          # Git reads this configuration from the environment of this step only, so the
          # token is neither written to `~/.gitconfig` nor seen by the later steps, and
          # the URL `mix.lock` records stays the plain one. `deps.get` runs in this step.
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.private-deps.outputs.token }}@github.com/EmpoweredHouse/eh-os-contract.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/EmpoweredHouse/eh-os-contract
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ steps.private-deps.outputs.token }}@github.com/EmpoweredHouse/ehos-tools.insteadOf
          GIT_CONFIG_VALUE_1: https://github.com/EmpoweredHouse/ehos-tools
        run: ehosctl init shop
      # The first commit is on `main`, the branch the generated CI publishes from, whatever the
      # runner's git names a new repository's first branch (#190).
      - name: The first commit is on main
        working-directory: ${{ runner.temp }}/shop
        run: |
          branch=$(git branch --show-current)
          if [ "$branch" != main ]; then
            echo "::error::ehosctl init made its first commit on '$branch', not main"
            exit 1
          fi
      # `mise exec` with no tools named uses the project's `.tool-versions`, which only
      # works because `init` trusted it.
      - working-directory: ${{ runner.temp }}/shop
        run: mise exec -- mix ecto.setup
      - working-directory: ${{ runner.temp }}/shop
        run: mise exec -- mix precommit

  # What a release would publish, checked and written into the summary. On a pushed tag, it is
  # handed to `publish`; started by hand on `main`, it is a preview of a release of that commit,
  # with `## [Unreleased]` as the notes. A release whose `e2e` failed by chance is retried with
  # "Re-run failed jobs" on the tag's run. It reads the repository and runs nothing but the
  # binary it checks: the token that may write is `publish`'s alone.
  release:
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [check, test-ehos-app, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - id: tag
        name: The tag is a version
        if: env.PUBLISH == 'true'
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag of ehosctl, vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # The commit the binaries were built from, which is checked against what the tag names
      # now. All of history, to check that it is on main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main, and the tag names it
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ]; then
            tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG names $tagged now, not $GITHUB_SHA, which this run was started for"
              exit 1
            fi
          fi
      - uses: actions/download-artifact@v8
        with:
          name: ehosctl
          path: ${{ runner.temp }}/dist
      - id: version
        name: The binaries and release.json are of this commit, and of the tag's version
        working-directory: ${{ runner.temp }}/dist
        run: |
          version=$(jq -r .version release.json)
          jq -e --arg commit "$GITHUB_SHA" \
            '.schema == "ehos.release/v1" and .component == "ehosctl" and .commit == $commit' \
            release.json
          chmod +x ehosctl_*
          # Only the first line, `ehosctl <version>`, is compared, so that a later line (the
          # commit a -dev build is made from, eh-os D-91) leaves the check working.
          built=$(./ehosctl_linux_x64 --version | sed -n 1p)
          if [ "$built" != "ehosctl $version" ]; then
            echo "::error::The binaries say '$built', release.json says $version"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::packages/ehosctl/mix.exs says $version, the tag $TAG"
            exit 1
          fi
          # A preview reads the lines that are not released yet, unless the commit is a release's
          # pull request, merged and not tagged yet: then exactly what its tag will publish.
          if [ "$PUBLISH" = "true" ] || [[ "$version" != *-* ]]; then
            section=$version
          else
            section=Unreleased
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SECTION=$section" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: parse-changelog@0.6.17
      - name: Take the section from packages/ehosctl/CHANGELOG.md
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          if ! parse-changelog packages/ehosctl/CHANGELOG.md "$SECTION" > "$RUNNER_TEMP/notes/notes.md"; then
            echo "::error::packages/ehosctl/CHANGELOG.md has no section $SECTION"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/notes.md"; then
            echo "::error::packages/ehosctl/CHANGELOG.md's section $SECTION is empty"
            exit 1
          fi
      - name: Write the notes and release.json into the summary
        run: |
          {
            echo "## Notes of ${TAG:-a preview of $GITHUB_SHA}, section $SECTION"
            echo
            cat "$RUNNER_TEMP/notes/notes.md"
            echo
            echo "## release.json"
            echo
            echo '```json'
            jq . "$RUNNER_TEMP/dist/release.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ehosctl-notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error
          # As long as the binaries: `publish` may wait for approval.
          retention-days: 7

  # Publishes what `release` checked, on a pushed tag only. The one job with a token that may
  # write to the repository, so it checks nothing out and runs nothing but `sha256sum` and `gh`
  # on the artifacts. It runs in the environment `release`, whose protection rules (which tags
  # may deploy, and who must approve where the plan allows it) are the repository's settings: the
  # environment is created without any by the first run that names it.
  publish:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ehosctl
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@v8
        with:
          name: ehosctl-notes
          path: ${{ runner.temp }}/notes
      - working-directory: ${{ runner.temp }}/dist
        run: sha256sum ehosctl_* release.json > SHA256SUMS
      # Attestations on a private repository need GitHub Enterprise Cloud.
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/dist/ehosctl_*
            ${{ runner.temp }}/dist/release.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/dist
        # The tag may not have moved while the release waited in its environment. Asked for as
        # `refs/tags/<tag>`: a bare name resolves to a branch of the same name before a tag, so a
        # branch named like the tag at the prepared commit would pass while the tag had moved.
        # (`commits/tags/<tag>` is refused by the API with 422.)
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG names $tagged now, not $GITHUB_SHA, which the binaries were built from"
            exit 1
          fi
          # mise installs `github:EmpoweredHouse/ehos-tools` from the release GitHub marks latest,
          # and only ehosctl's releases may be that one; a patch to an older minor, released after
          # a newer one, may not either. Decided here, not in `release`, since another release may
          # have been published while this one waited in its environment. Compared with the
          # releases published, not with the tags: a tag whose run failed publishes nothing, and the
          # patch that follows it must still become latest.
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select((.isDraft or .isPrerelease) | not) | .tagName')
          highest=$(printf '%s\n%s\n' "$published" "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$highest" = "$TAG" ]; then latest=true; else latest=false; fi
          gh release create "$TAG" ehosctl_* SHA256SUMS release.json --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "ehosctl $VERSION" --notes-file "$RUNNER_TEMP/notes/notes.md" \
            --latest="$latest"

  install:
    name: install (${{ matrix.runner }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # mise, from 2026.10, checks a release's GitHub artifact attestations before it installs
    # from it, through an API the job's token reads only with `attestations: read`. Without
    # it, every install of v0.1.0 failed with 403 "Resource not accessible by integration".
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: false
      # The route the README documents: mise picks the asset for this platform by name.
      # The token is what a developer sets while the repository is private.
      - env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise use -g "github:${GITHUB_REPOSITORY}@${GITHUB_REF_NAME#v}"
      # The first line, `ehosctl <version>`, as `release` compares it.
      - run: test "$(mise exec -- ehosctl --version | sed -n 1p)" = "ehosctl ${GITHUB_REF_NAME#v}"
