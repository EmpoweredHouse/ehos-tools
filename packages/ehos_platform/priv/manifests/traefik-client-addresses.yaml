# eh-os D-117: k3s's bundled Traefik keeps each client's own address. The governance plane holds a
# client to its share of the console's connections by the address Traefik names in a PROXY protocol
# header, which is the address a connection reaches Traefik from. Behind k3s's ServiceLB, with the
# Service's default `externalTrafficPolicy: Cluster`, that is a node's for every client; `Local`
# keeps the client's on a node that runs Traefik, which on the single-node server EHOS installs is
# every client. k3s's helm-controller applies these values to the Traefik it installs; ServiceLB's
# pods roll once when they change. The installer writes this object whole on every run: values
# added to it by hand are lost.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: ehos-installer
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
