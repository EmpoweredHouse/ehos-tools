<!-- title: Who presents what to whom, and where a request is refused -->
<!-- desc: A person signs in through EHOS's OpenID Connect provider, which gives the application a ten-minute credential for them; the application's eh_os_contract_auth checks it and refuses in its engine what it does not allow. A pipeline exchanges GitHub Actions' token for its deployment identity's credential and deploys through EHOS's API, and a workload principal reads the people directory there; an application presents there a signed-in person's credential for them to grant a role their grant rule names; the API decides each call, and the provider each credential, from the role bindings and grant rules in force. -->
<!-- words: person, workload principal, deployment identity, credential, role binding, application, governance plane -->
<!-- technical: OpenID Connect, ehos.api/v1, ehos.credential, eh_os_contract_auth -->
<!-- verbs: signs, exchanges, deploys, reads, grants -->
<!-- parts: person = principals, identity = deployment-identity, workload = principals, signin = application-sign-in, credential = credentials-and-keys, bindings = roles-and-capabilities, api = enforcement-points, app = how-a-command-runs, library = enforcement-points -->
<svg viewBox="0 0 1000 744" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="authority-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Zones -->
  <rect class="zone" x="40" y="72" width="260" height="468" rx="8"/>
  <rect class="mask" x="56" y="66" width="80" height="12" rx="2"/>
  <text class="zlabel" x="60" y="75">WHO ACTS</text>

  <rect class="zone" x="360" y="72" width="260" height="468" rx="8"/>
  <rect class="mask" x="376" y="66" width="196" height="12" rx="2"/>
  <text class="zlabel" x="380" y="75">EHOS · THE GOVERNANCE PLANE</text>

  <rect class="zone" x="760" y="72" width="200" height="200" rx="8"/>
  <rect class="mask" x="776" y="66" width="104" height="12" rx="2"/>
  <text class="zlabel" x="780" y="75">AN APPLICATION</text>

  <!-- Connectors (behind the parts) -->
  <line class="arr" x1="280" y1="136" x2="379" y2="136" marker-end="url(#authority-arrow)"/>
  <line class="arr" x1="600" y1="136" x2="775" y2="136" marker-end="url(#authority-arrow)"/>
  <polyline class="arr" points="280,352 330,352 330,200 379,200" marker-end="url(#authority-arrow)"/>
  <line class="arr" x1="280" y1="388" x2="379" y2="388" marker-end="url(#authority-arrow)"/>
  <polyline class="arr" points="280,480 490,480 490,409" marker-end="url(#authority-arrow)"/>
  <polyline class="arr" points="860,248 860,372 601,372" marker-end="url(#authority-arrow)"/>
  <line class="uses" x1="490" y1="216" x2="490" y2="248"/>
  <line class="uses" x1="490" y1="304" x2="490" y2="336"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="288" y="114" width="72" height="14" rx="2"/>
  <circle class="badge" cx="298" cy="121" r="6"/>
  <text class="badget" x="298" y="124" text-anchor="middle">1</text>
  <text class="lbl" x="310" y="124">SIGNS IN</text>

  <rect class="mask" x="628" y="142" width="112" height="14" rx="2"/>
  <circle class="badge" cx="638" cy="149" r="6"/>
  <text class="badget" x="638" y="152" text-anchor="middle">2</text>
  <text class="lbl" x="650" y="152">ehos.credential</text>

  <rect class="mask" x="296" y="260" width="80" height="14" rx="2"/>
  <circle class="badge" cx="306" cy="267" r="6"/>
  <text class="badget" x="306" y="270" text-anchor="middle">3</text>
  <text class="lbl" x="318" y="270">EXCHANGES</text>

  <rect class="mask" x="288" y="394" width="64" height="14" rx="2"/>
  <circle class="badge" cx="298" cy="401" r="6"/>
  <text class="badget" x="298" y="404" text-anchor="middle">4</text>
  <text class="lbl" x="310" y="404">DEPLOYS</text>

  <rect class="mask" x="384" y="473" width="52" height="14" rx="2"/>
  <circle class="badge" cx="394" cy="480" r="6"/>
  <text class="badget" x="394" y="483" text-anchor="middle">5</text>
  <text class="lbl" x="406" y="483">READS</text>

  <rect class="mask" x="640" y="350" width="72" height="14" rx="2"/>
  <circle class="badge" cx="650" cy="357" r="6"/>
  <text class="badget" x="650" y="360" text-anchor="middle">6</text>
  <text class="lbl" x="662" y="360">GRANTS</text>

  <!-- A person -->
  <rect class="knock" x="60" y="104" width="220" height="64" rx="6"/>
  <rect id="authority-person" class="n-back" x="60" y="104" width="220" height="64" rx="6"/>
  <text class="name" x="170" y="132" text-anchor="middle">Person</text>
  <text class="sub" x="170" y="150" text-anchor="middle">invited · disabled, never deleted</text>

  <!-- A deployment identity -->
  <rect class="knock" x="60" y="336" width="220" height="72" rx="6"/>
  <rect id="authority-identity" class="n-back" x="60" y="336" width="220" height="72" rx="6"/>
  <text class="name" x="160" y="368" text-anchor="middle">Deployment identity</text>
  <text class="sub" x="170" y="388" text-anchor="middle">a pipeline, for whoever ran it</text>

  <!-- A workload principal -->
  <rect class="knock" x="60" y="448" width="220" height="64" rx="6"/>
  <rect id="authority-workload" class="n-back" x="60" y="448" width="220" height="64" rx="6"/>
  <text class="name" x="170" y="476" text-anchor="middle">Workload principal</text>
  <text class="sub" x="170" y="494" text-anchor="middle">an application acting as itself</text>

  <!-- The OpenID Connect provider, with the credential it issues -->
  <rect class="knock" x="380" y="104" width="220" height="112" rx="6"/>
  <rect id="authority-signin" class="n-focal" x="380" y="104" width="220" height="112" rx="6"/>
  <text class="name" x="490" y="128" text-anchor="middle">OpenID Connect</text>
  <text class="sub" x="490" y="146" text-anchor="middle">signs people in · issues credentials</text>
  <rect id="authority-credential" class="chip" x="400" y="160" width="180" height="44" rx="4"/>
  <text class="chipt" x="490" y="178" text-anchor="middle">Credential</text>
  <text class="sub" x="490" y="194" text-anchor="middle">ten minutes · signed by EHOS</text>

  <!-- Role bindings -->
  <rect class="knock" x="380" y="248" width="220" height="56" rx="6"/>
  <rect id="authority-bindings" class="n-store" x="380" y="248" width="220" height="56" rx="6"/>
  <text class="name" x="490" y="272" text-anchor="middle">Role bindings</text>
  <text class="sub" x="490" y="290" text-anchor="middle">who holds which role, where</text>

  <!-- EHOS's console and API -->
  <rect class="knock" x="380" y="336" width="220" height="72" rx="6"/>
  <rect id="authority-api" class="n-focal" x="380" y="336" width="220" height="72" rx="6"/>
  <text class="name" x="490" y="362" text-anchor="middle">ehos.api/v1</text>
  <text class="sub" x="490" y="380" text-anchor="middle">the console and the API</text>
  <text class="sub" x="490" y="396" text-anchor="middle">decided at each call</text>

  <!-- An application, with eh_os_contract_auth inside it -->
  <rect class="knock" x="776" y="104" width="168" height="144" rx="6"/>
  <rect id="authority-app" class="n-back" x="776" y="104" width="168" height="144" rx="6"/>
  <text class="name" x="860" y="128" text-anchor="middle">Application</text>

  <rect id="authority-library" class="n-store" x="788" y="144" width="144" height="88" rx="6"/>
  <text class="name" x="860" y="170" text-anchor="middle">eh_os_contract_auth</text>
  <text class="sub" x="860" y="190" text-anchor="middle">checks the credential</text>
  <text class="sub" x="860" y="206" text-anchor="middle">refuses in the engine</text>
  <text class="sub" x="860" y="222" text-anchor="middle">without asking EHOS</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="564" x2="960" y2="564"/>
  <text class="eyes" x="40" y="584">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="604" r="6"/>
  <text class="badget" x="46" y="607" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="608">A person signs in through EHOS, for the console and each application.</text>
  <circle class="badge" cx="46" cy="628" r="6"/>
  <text class="badget" x="46" y="631" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="632">EHOS gives the application a credential for that person.</text>
  <circle class="badge" cx="46" cy="652" r="6"/>
  <text class="badget" x="46" y="655" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="656">A pipeline exchanges GitHub Actions' token for a credential.</text>
  <circle class="badge" cx="506" cy="604" r="6"/>
  <text class="badget" x="506" y="607" text-anchor="middle">4</text>
  <text class="keyt" x="520" y="608">It deploys through EHOS's API, to ephemeral environments only.</text>
  <circle class="badge" cx="506" cy="628" r="6"/>
  <text class="badget" x="506" y="631" text-anchor="middle">5</text>
  <text class="keyt" x="520" y="632">An application reads the people directory as itself, once agreed to.</text>
  <circle class="badge" cx="506" cy="652" r="6"/>
  <text class="badget" x="506" y="655" text-anchor="middle">6</text>
  <text class="keyt" x="520" y="656">It presents a person's credential for them to grant.</text>
  <text class="keyt" x="60" y="680">EHOS decides from role bindings, the application from its credential.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="700" x2="960" y2="700"/>
  <rect class="n-focal" x="40" y="716" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="725">EHOS deciding</text>
  <rect class="n-back" x="150" y="716" width="14" height="10" rx="2"/>
  <text class="legt" x="170" y="725">A principal or an application</text>
  <rect class="n-store" x="340" y="716" width="14" height="10" rx="2"/>
  <text class="legt" x="360" y="725">Kept, or inside another</text>
  <rect class="chip" x="490" y="716" width="14" height="10" rx="2"/>
  <text class="legt" x="520" y="725">What one issues</text>
  <line class="arr" x1="640" y1="721" x2="667" y2="721" marker-end="url(#authority-arrow)"/>
  <text class="legt" x="676" y="725">Presents or hands over</text>
  <line class="uses" x1="820" y1="721" x2="848" y2="721"/>
  <text class="legt" x="856" y="725">Decided from</text>
  </g>
</svg>
