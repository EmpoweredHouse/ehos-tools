<!-- title: The loop EHOS closes, and the areas along it -->
<!-- desc: The contract the business agreed is compiled into an application, which EHOS deploys and runs; what happens is recorded in the contract's words and compared with it, and the difference goes back to whoever corrects the contract or the code. Authority decides every action along the loop, facts carry it between applications, and the platform delivers and installs all of it. -->
<!-- words: contract, application, deployment, conformance, grant, fact, installation -->
<!-- verbs: compiled into, deployed, recorded, corrected -->
<!-- parts: contract = contract-declarations, application = how-a-command-runs, system = fact-delivery, operation = deployment-lifecycle, evidence = conformance, authority = roles-and-capabilities, platform = installation-and-upgrade -->
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="areas-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Zone: what holds across every area -->
  <rect class="zone" x="40" y="40" width="920" height="424" rx="8"/>
  <rect class="mask" x="56" y="34" width="340" height="12" rx="2"/>
  <text class="zlabel" x="60" y="43">ACROSS THE AREAS · STATE · LIFECYCLES · PROPERTIES</text>

  <!-- The loop: four arcs, clockwise -->
  <path class="ring" d="M 530 104 A 150 116 0 0 1 680 219" marker-end="url(#areas-arrow)"/>
  <path class="ring" d="M 680 280 A 150 116 0 0 1 531 396" marker-end="url(#areas-arrow)"/>
  <path class="ring" d="M 350 396 A 150 116 0 0 1 200 281" marker-end="url(#areas-arrow)"/>
  <path class="ring" d="M 200 220 A 150 116 0 0 1 349 104" marker-end="url(#areas-arrow)"/>
  <line class="uses" x1="770" y1="250" x2="800" y2="250"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="640" y="122" width="112" height="14" rx="2"/>
  <circle class="badge" cx="650" cy="129" r="6"/>
  <text class="badget" x="650" y="132" text-anchor="middle">1</text>
  <text class="lbl" x="662" y="132">COMPILED INTO</text>

  <rect class="mask" x="640" y="356" width="80" height="14" rx="2"/>
  <circle class="badge" cx="650" cy="363" r="6"/>
  <text class="badget" x="650" y="366" text-anchor="middle">2</text>
  <text class="lbl" x="662" y="366">DEPLOYED</text>

  <rect class="mask" x="178" y="356" width="80" height="14" rx="2"/>
  <circle class="badge" cx="188" cy="363" r="6"/>
  <text class="badget" x="188" y="366" text-anchor="middle">3</text>
  <text class="lbl" x="200" y="366">RECORDED</text>

  <rect class="mask" x="168" y="122" width="88" height="14" rx="2"/>
  <circle class="badge" cx="178" cy="129" r="6"/>
  <text class="badget" x="178" y="132" text-anchor="middle">4</text>
  <text class="lbl" x="190" y="132">CORRECTED</text>

  <!-- The agreement -->
  <rect class="knock" x="350" y="72" width="180" height="64" rx="6"/>
  <rect id="areas-contract" class="n-back" x="350" y="72" width="180" height="64" rx="6"/>
  <rect class="tag" x="358" y="80" width="76" height="12" rx="2"/>
  <text class="tagt" x="396" y="89" text-anchor="middle">THE AGREEMENT</text>
  <text class="name" x="440" y="110" text-anchor="middle">Contract</text>
  <text class="sub" x="440" y="126" text-anchor="middle">what the business decided</text>

  <!-- The application -->
  <rect class="knock" x="590" y="220" width="180" height="60" rx="6"/>
  <rect id="areas-application" class="n-back" x="590" y="220" width="180" height="60" rx="6"/>
  <rect class="tag" x="598" y="228" width="88" height="12" rx="2"/>
  <text class="tagt" x="642" y="237" text-anchor="middle">THE APPLICATION</text>
  <text class="name" x="680" y="256" text-anchor="middle">Application</text>
  <text class="sub" x="680" y="271" text-anchor="middle">one process, running</text>

  <!-- The system of applications -->
  <rect class="knock" x="800" y="220" width="140" height="60" rx="6"/>
  <rect id="areas-system" class="n-back m-planned" x="800" y="220" width="140" height="60" rx="6"/>
  <rect class="tag" x="808" y="228" width="112" height="12" rx="2"/>
  <text class="tagt" x="864" y="237" text-anchor="middle">THE SYSTEM · PLANNED</text>
  <text class="name" x="870" y="256" text-anchor="middle">Fact</text>
  <text class="sub" x="870" y="271" text-anchor="middle">between applications</text>

  <!-- Operation -->
  <rect class="knock" x="350" y="364" width="180" height="64" rx="6"/>
  <rect id="areas-operation" class="n-back" x="350" y="364" width="180" height="64" rx="6"/>
  <rect class="tag" x="358" y="372" width="60" height="12" rx="2"/>
  <text class="tagt" x="388" y="381" text-anchor="middle">OPERATION</text>
  <text class="name" x="440" y="402" text-anchor="middle">Deployment</text>
  <text class="sub" x="440" y="418" text-anchor="middle">run, and kept running</text>

  <!-- Evidence -->
  <rect class="knock" x="110" y="220" width="180" height="60" rx="6"/>
  <rect id="areas-evidence" class="n-back m-open" x="110" y="220" width="180" height="60" rx="6"/>
  <rect class="tag" x="118" y="228" width="84" height="12" rx="2"/>
  <text class="tagt" x="160" y="237" text-anchor="middle">EVIDENCE · OPEN</text>
  <text class="name" x="200" y="256" text-anchor="middle">Conformance</text>
  <text class="sub" x="200" y="271" text-anchor="middle">does it still match?</text>

  <!-- Authority, at the centre (focal) -->
  <rect class="knock" x="350" y="216" width="180" height="68" rx="6"/>
  <rect id="areas-authority" class="n-focal" x="350" y="216" width="180" height="68" rx="6"/>
  <rect class="tag-focal" x="358" y="224" width="60" height="12" rx="2"/>
  <text class="tagt-focal" x="388" y="233" text-anchor="middle">AUTHORITY</text>
  <text class="name" x="440" y="256" text-anchor="middle">Grant</text>
  <text class="sub" x="440" y="272" text-anchor="middle">every action, decided once</text>

  <!-- Platform and ecosystem, underneath -->
  <rect class="knock" x="40" y="480" width="920" height="48" rx="6"/>
  <rect id="areas-platform" class="n-shared" x="40" y="480" width="920" height="48" rx="6"/>
  <rect class="tag" x="48" y="488" width="128" height="12" rx="2"/>
  <text class="tagt" x="112" y="497" text-anchor="middle">PLATFORM AND ECOSYSTEM</text>
  <text class="name" x="500" y="503" text-anchor="middle">Installation</text>
  <text class="sub" x="500" y="518" text-anchor="middle">EHOS, and the tools that deliver, install and style it</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="548" x2="960" y2="548"/>
  <text class="eyes" x="40" y="566">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="582" r="6"/>
  <text class="badget" x="46" y="585" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="586">The contract is compiled into the application that runs it.</text>
  <circle class="badge" cx="46" cy="602" r="6"/>
  <text class="badget" x="46" y="605" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="606">EHOS deploys the application and keeps it running.</text>
  <circle class="badge" cx="506" cy="582" r="6"/>
  <text class="badget" x="506" y="585" text-anchor="middle">3</text>
  <text class="keyt" x="520" y="586">What happens is recorded in the contract's own words.</text>
  <circle class="badge" cx="506" cy="602" r="6"/>
  <text class="badget" x="506" y="605" text-anchor="middle">4</text>
  <text class="keyt" x="520" y="606">The difference reaches whoever corrects the contract or the code.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="618" x2="960" y2="618"/>
  <rect class="n-focal" x="40" y="626" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="635">Decides every action</text>
  <rect class="n-back" x="184" y="626" width="14" height="10" rx="2"/>
  <text class="legt" x="204" y="635">An area</text>
  <rect class="n-back m-planned" x="270" y="626" width="14" height="10" rx="2"/>
  <text class="legt" x="290" y="635">Planned</text>
  <rect class="n-back m-open" x="350" y="626" width="14" height="10" rx="2"/>
  <text class="legt" x="370" y="635">A known gap</text>
  <rect class="n-shared" x="460" y="626" width="14" height="10" rx="2"/>
  <text class="legt" x="480" y="635">Delivers and installs</text>
  <line class="ring" x1="612" y1="631" x2="639" y2="631" marker-end="url(#areas-arrow)"/>
  <text class="legt" x="648" y="635">The loop</text>
  <line class="uses" x1="716" y1="631" x2="744" y2="631"/>
  <text class="legt" x="752" y="635">Carries it between applications</text>
  </g>
</svg>
