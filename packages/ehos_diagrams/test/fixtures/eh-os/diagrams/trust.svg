<!-- title: What a compromised governance plane reaches, and what holds it back -->
<!-- desc: In EHOS's namespace the governance plane writes EHOS's objects and secrets' values, adds to its own audit record, reads every log and adds lines to it, and signs a credential for any person. The operator reads the objects and the values and makes each workload, which is given its application's secrets and database. Admission policies hold what any workload may be, whoever asked for it; images signed with a key the governance plane does not hold are only an idea. -->
<!-- words: governance plane, operator, workload, secret, credential, audit record, application, environment -->
<!-- technical: Kubernetes, OpenBao, VictoriaLogs, Admission policies, Signed images -->
<!-- verbs: writes, reads, adds, signs, makes, holds -->
<!-- parts: governance = governance-plane-trust, objects = operator-and-cluster-objects, operator = operator-and-cluster-objects, record = what-is-recorded, openbao = secrets, logs = logs-and-telemetry, admission = operator-and-cluster-objects, signed = governance-plane-containment, workload = given-at-start -->
<svg viewBox="0 0 1000 840" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="trust-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Zones -->
  <rect class="zone" x="40" y="72" width="920" height="328" rx="8"/>
  <rect class="mask" x="56" y="66" width="128" height="12" rx="2"/>
  <text class="zlabel" x="60" y="75">EHOS'S NAMESPACE</text>

  <rect class="zone" x="40" y="448" width="340" height="152" rx="8"/>
  <rect class="mask" x="56" y="442" width="140" height="12" rx="2"/>
  <text class="zlabel" x="60" y="451">THE WHOLE CLUSTER</text>

  <rect class="zone" x="480" y="448" width="480" height="152" rx="8"/>
  <rect class="mask" x="496" y="442" width="208" height="12" rx="2"/>
  <text class="zlabel" x="500" y="451">AN ENVIRONMENT'S NAMESPACE</text>

  <!-- Connectors (behind the parts) -->
  <line class="arr" x1="500" y1="216" x2="500" y2="169" marker-end="url(#trust-arrow)"/>
  <line class="arr" x1="600" y1="248" x2="739" y2="248" marker-end="url(#trust-arrow)"/>
  <polyline class="arr" points="400,232 160,232 160,169" marker-end="url(#trust-arrow)"/>
  <polyline class="arr" points="440,280 440,344 261,344" marker-end="url(#trust-arrow)"/>
  <polyline class="arr" points="560,280 560,424 680,424 680,479" marker-end="url(#trust-arrow)"/>
  <line class="arr" x1="740" y1="136" x2="601" y2="136" marker-end="url(#trust-arrow)"/>
  <line class="arr" x1="800" y1="168" x2="800" y2="215" marker-end="url(#trust-arrow)"/>
  <line class="arr" x1="920" y1="168" x2="920" y2="479" marker-end="url(#trust-arrow)"/>
  <line class="arr" x1="360" y1="528" x2="639" y2="528" marker-end="url(#trust-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="508" y="184" width="72" height="14" rx="2"/>
  <circle class="badge" cx="518" cy="191" r="6"/>
  <text class="badget" x="518" y="194" text-anchor="middle">1</text>
  <text class="lbl" x="530" y="194">WRITES</text>

  <rect class="mask" x="612" y="226" width="72" height="14" rx="2"/>
  <circle class="badge" cx="622" cy="233" r="6"/>
  <text class="badget" x="622" y="236" text-anchor="middle">2</text>
  <text class="lbl" x="634" y="236">WRITES</text>

  <rect class="mask" x="272" y="210" width="56" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="217" r="6"/>
  <text class="badget" x="282" y="220" text-anchor="middle">3</text>
  <text class="lbl" x="294" y="220">ADDS</text>

  <rect class="mask" x="272" y="322" width="120" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="329" r="6"/>
  <text class="badget" x="282" y="332" text-anchor="middle">4</text>
  <text class="lbl" x="294" y="332">READS, ADDS</text>

  <rect class="mask" x="568" y="338" width="64" height="14" rx="2"/>
  <circle class="badge" cx="578" cy="345" r="6"/>
  <text class="badget" x="578" y="348" text-anchor="middle">5</text>
  <text class="lbl" x="590" y="348">SIGNS</text>

  <rect class="mask" x="612" y="114" width="64" height="14" rx="2"/>
  <circle class="badge" cx="622" cy="121" r="6"/>
  <text class="badget" x="622" y="124" text-anchor="middle">6</text>
  <text class="lbl" x="634" y="124">READS</text>

  <rect class="mask" x="808" y="184" width="64" height="14" rx="2"/>
  <circle class="badge" cx="818" cy="191" r="6"/>
  <text class="badget" x="818" y="194" text-anchor="middle">7</text>
  <text class="lbl" x="830" y="194">READS</text>

  <rect class="mask" x="848" y="314" width="64" height="14" rx="2"/>
  <circle class="badge" cx="858" cy="321" r="6"/>
  <text class="badget" x="858" y="324" text-anchor="middle">8</text>
  <text class="lbl" x="870" y="324">MAKES</text>

  <rect class="mask" x="400" y="506" width="64" height="14" rx="2"/>
  <circle class="badge" cx="410" cy="513" r="6"/>
  <text class="badget" x="410" y="516" text-anchor="middle">9</text>
  <text class="lbl" x="422" y="516">HOLDS</text>

  <!-- The audit record -->
  <rect class="knock" x="60" y="104" width="200" height="64" rx="6"/>
  <rect id="trust-record" class="n-store" x="60" y="104" width="200" height="64" rx="6"/>
  <text class="name" x="160" y="130" text-anchor="middle">Audit record</text>
  <text class="sub" x="160" y="148" text-anchor="middle">in EHOS's own database</text>

  <!-- EHOS's three kinds of object -->
  <rect class="knock" x="400" y="104" width="200" height="64" rx="6"/>
  <rect id="trust-objects" class="n-store" x="400" y="104" width="200" height="64" rx="6"/>
  <text class="name" x="500" y="130" text-anchor="middle">Kubernetes</text>
  <text class="sub" x="500" y="148" text-anchor="middle">EHOS's objects</text>

  <!-- The operator -->
  <rect class="knock" x="740" y="104" width="200" height="64" rx="6"/>
  <rect id="trust-operator" class="n-focal" x="740" y="104" width="200" height="64" rx="6"/>
  <text class="name" x="840" y="130" text-anchor="middle">Operator</text>
  <text class="sub" x="840" y="148" text-anchor="middle">reads every value it gives</text>

  <!-- The governance plane -->
  <rect class="knock" x="400" y="216" width="200" height="64" rx="6"/>
  <rect id="trust-governance" class="n-focal" x="400" y="216" width="200" height="64" rx="6"/>
  <text class="name" x="500" y="242" text-anchor="middle">Governance plane</text>
  <text class="sub" x="500" y="260" text-anchor="middle">faces the world</text>

  <!-- OpenBao -->
  <rect class="knock" x="740" y="216" width="140" height="64" rx="6"/>
  <rect id="trust-openbao" class="n-store" x="740" y="216" width="140" height="64" rx="6"/>
  <text class="name" x="810" y="242" text-anchor="middle">OpenBao</text>
  <text class="sub" x="810" y="260" text-anchor="middle">secrets' values</text>

  <!-- The log store -->
  <rect class="knock" x="60" y="312" width="200" height="64" rx="6"/>
  <rect id="trust-logs" class="n-store" x="60" y="312" width="200" height="64" rx="6"/>
  <text class="name" x="160" y="338" text-anchor="middle">VictoriaLogs</text>
  <text class="sub" x="160" y="356" text-anchor="middle">every application's logs</text>

  <!-- Admission policies, with the idea of signed images -->
  <rect class="knock" x="60" y="480" width="300" height="96" rx="6"/>
  <rect id="trust-admission" class="n-shared" x="60" y="480" width="300" height="96" rx="6"/>
  <text class="name" x="210" y="504" text-anchor="middle">Admission policies</text>
  <rect id="trust-signed" class="chip m-idea" x="80" y="516" width="260" height="48" rx="4"/>
  <rect class="tag" x="294" y="522" width="40" height="12" rx="2"/>
  <text class="tagt" x="314" y="531" text-anchor="middle">IDEA</text>
  <text class="chipt" x="190" y="537" text-anchor="middle">Signed images</text>
  <text class="sub" x="190" y="554" text-anchor="middle">a key it does not hold</text>

  <!-- A workload -->
  <rect class="knock" x="640" y="480" width="300" height="96" rx="6"/>
  <rect id="trust-workload" class="n-back" x="640" y="480" width="300" height="96" rx="6"/>
  <text class="name" x="790" y="508" text-anchor="middle">Workload</text>
  <text class="sub" x="790" y="528" text-anchor="middle">any application, any environment</text>
  <text class="sub" x="790" y="544" text-anchor="middle">given its secrets, and its database</text>
  <text class="sub" x="790" y="560" text-anchor="middle">as the schema's owner</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="628" x2="960" y2="628"/>
  <text class="eyes" x="40" y="648">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="668" r="6"/>
  <text class="badget" x="46" y="671" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="672">It writes any deployment, of any image EHOS allows.</text>
  <circle class="badge" cx="46" cy="692" r="6"/>
  <text class="badget" x="46" y="695" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="696">It writes and deletes values, and cannot read one.</text>
  <circle class="badge" cx="46" cy="716" r="6"/>
  <text class="badget" x="46" y="719" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="720">It adds rows, under any person's name.</text>
  <circle class="badge" cx="46" cy="740" r="6"/>
  <text class="badget" x="46" y="743" text-anchor="middle">4</text>
  <text class="keyt" x="60" y="744">It reads every log, and adds lines to any.</text>
  <circle class="badge" cx="46" cy="764" r="6"/>
  <text class="badget" x="46" y="767" text-anchor="middle">5</text>
  <text class="keyt" x="60" y="768">It signs a credential for any person.</text>
  <circle class="badge" cx="506" cy="668" r="6"/>
  <text class="badget" x="506" y="671" text-anchor="middle">6</text>
  <text class="keyt" x="520" y="672">The operator reads what it wrote.</text>
  <circle class="badge" cx="506" cy="692" r="6"/>
  <text class="badget" x="506" y="695" text-anchor="middle">7</text>
  <text class="keyt" x="520" y="696">It reads the values the deployment names.</text>
  <circle class="badge" cx="506" cy="716" r="6"/>
  <text class="badget" x="506" y="719" text-anchor="middle">8</text>
  <text class="keyt" x="520" y="720">It makes the workload, migrations and all.</text>
  <circle class="badge" cx="506" cy="740" r="6"/>
  <text class="badget" x="506" y="743" text-anchor="middle">9</text>
  <text class="keyt" x="520" y="744">Admission holds what any workload may be.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="796" x2="960" y2="796"/>
  <rect class="n-focal" x="40" y="812" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="821">An EHOS role</text>
  <rect class="n-store" x="170" y="812" width="14" height="10" rx="2"/>
  <text class="legt" x="190" y="821">Kept</text>
  <rect class="n-shared" x="270" y="812" width="14" height="10" rx="2"/>
  <text class="legt" x="290" y="821">The cluster's own rule</text>
  <rect class="n-back" x="470" y="812" width="14" height="10" rx="2"/>
  <text class="legt" x="490" y="821">What an application runs</text>
  <line class="arr" x1="700" y1="817" x2="727" y2="817" marker-end="url(#trust-arrow)"/>
  <text class="legt" x="736" y="821">What it does</text>
  </g>
</svg>
