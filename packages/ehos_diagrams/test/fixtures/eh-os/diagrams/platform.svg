<!-- title: EHOS's components, across their repositories -->
<!-- desc: In ehos-tools, ehosctl, the installation code, the application template and the design system; in eh-os, EHOS, which draws graphs with eh-os-contract's eh_os_contract_graph; in a client's repository, an application with eh_os_contract inside it. ehosctl calls EHOS's API, the installation code installs EHOS from a release, the application template makes the application, which submits its manifest to EHOS, and EHOS issues the credentials eh_os_contract checks. -->
<!-- words: application template, application, governance plane, operator -->
<!-- technical: ehosctl, ehos_platform, ehos_design, ehos, eh_os_contract, eh_os_contract_graph, ehos.api/v1, ehos.manifest, ehos.credential -->
<!-- verbs: installs, makes -->
<!-- parts: ehosctl = ehosctl-planes, platform = installation-and-upgrade, template = application-template, design = components-and-interfaces, ehos = components-and-interfaces, client = how-a-command-runs, library = components-and-interfaces -->
<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="platform-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Zones: one per repository -->
  <rect class="zone" x="40" y="72" width="400" height="404" rx="8"/>
  <rect class="mask" x="56" y="66" width="248" height="12" rx="2"/>
  <text class="zlabel" x="60" y="75">EHOS-TOOLS · THE TOOLS AROUND EHOS</text>

  <rect class="zone" x="560" y="72" width="400" height="152" rx="8"/>
  <rect class="mask" x="576" y="66" width="184" height="12" rx="2"/>
  <text class="zlabel" x="580" y="75">EH-OS · THE PLATFORM</text>

  <rect class="zone" x="560" y="300" width="400" height="176" rx="8"/>
  <rect class="mask" x="576" y="294" width="196" height="12" rx="2"/>
  <text class="zlabel" x="580" y="303">A CLIENT'S REPOSITORY</text>

  <!-- Connectors (behind the parts) -->
  <line class="arr" x1="416" y1="136" x2="583" y2="136" marker-end="url(#platform-arrow)"/>
  <polyline class="arr" points="416,232 500,232 500,184 583,184" marker-end="url(#platform-arrow)"/>
  <polyline class="arr" points="416,320 520,320 520,360 583,360" marker-end="url(#platform-arrow)"/>
  <line class="arr" x1="680" y1="331" x2="680" y2="201" marker-end="url(#platform-arrow)"/>
  <line class="arr" x1="840" y1="200" x2="840" y2="331" marker-end="url(#platform-arrow)"/>
  <line class="uses" x1="240" y1="168" x2="240" y2="208"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="448" y="114" width="104" height="14" rx="2"/>
  <circle class="badge" cx="458" cy="121" r="6"/>
  <text class="badget" x="458" y="124" text-anchor="middle">1</text>
  <text class="lbl" x="470" y="124">ehos.api/v1</text>

  <rect class="mask" x="424" y="240" width="72" height="14" rx="2"/>
  <circle class="badge" cx="434" cy="247" r="6"/>
  <text class="badget" x="434" y="250" text-anchor="middle">2</text>
  <text class="lbl" x="446" y="250">INSTALLS</text>

  <rect class="mask" x="424" y="328" width="60" height="14" rx="2"/>
  <circle class="badge" cx="434" cy="335" r="6"/>
  <text class="badget" x="434" y="338" text-anchor="middle">3</text>
  <text class="lbl" x="446" y="338">MAKES</text>

  <rect class="mask" x="588" y="250" width="88" height="14" rx="2"/>
  <circle class="badge" cx="598" cy="257" r="6"/>
  <text class="badget" x="598" y="260" text-anchor="middle">4</text>
  <text class="lbl" x="610" y="260">ehos.manifest</text>

  <rect class="mask" x="752" y="268" width="104" height="14" rx="2"/>
  <circle class="badge" cx="762" cy="275" r="6"/>
  <text class="badget" x="762" y="278" text-anchor="middle">5</text>
  <text class="lbl" x="774" y="278">ehos.credential</text>

  <!-- ehosctl -->
  <rect class="knock" x="64" y="104" width="352" height="64" rx="6"/>
  <rect id="platform-ehosctl" class="n-back" x="64" y="104" width="352" height="64" rx="6"/>
  <text class="name" x="240" y="132" text-anchor="middle">ehosctl</text>
  <text class="sub" x="240" y="150" text-anchor="middle">governed plane · platform plane</text>

  <!-- ehos_platform -->
  <rect class="knock" x="64" y="208" width="352" height="56" rx="6"/>
  <rect id="platform-platform" class="n-store" x="64" y="208" width="352" height="56" rx="6"/>
  <text class="name" x="240" y="232" text-anchor="middle">ehos_platform</text>
  <text class="sub" x="240" y="250" text-anchor="middle">makes a server · installs and upgrades EHOS</text>

  <!-- ehos_app, the application template -->
  <rect class="knock" x="64" y="296" width="352" height="56" rx="6"/>
  <rect id="platform-template" class="n-back" x="64" y="296" width="352" height="56" rx="6"/>
  <text class="name" x="240" y="320" text-anchor="middle">Application template</text>
  <text class="sub" x="240" y="338" text-anchor="middle">ehos_app · run again to upgrade</text>

  <!-- ehos_design -->
  <rect class="knock" x="64" y="384" width="352" height="64" rx="6"/>
  <rect id="platform-design" class="n-shared" x="64" y="384" width="352" height="64" rx="6"/>
  <text class="name" x="240" y="410" text-anchor="middle">ehos_design</text>
  <text class="sub" x="240" y="428" text-anchor="middle">the look of the console and every application</text>

  <!-- EHOS (focal) -->
  <rect class="knock" x="584" y="104" width="352" height="96" rx="6"/>
  <rect id="platform-ehos" class="n-focal" x="584" y="104" width="352" height="96" rx="6"/>
  <text class="name" x="760" y="136" text-anchor="middle">ehos</text>
  <text class="sub" x="760" y="154" text-anchor="middle">governance plane · operator · chart</text>
  <text class="sub" x="760" y="170" text-anchor="middle">says at GET /api/v1 what it accepts</text>
  <text class="sub" x="760" y="186" text-anchor="middle">draws graphs with eh_os_contract_graph</text>

  <!-- A client's application, with eh_os_contract inside it -->
  <rect class="knock" x="584" y="332" width="352" height="120" rx="6"/>
  <rect id="platform-client" class="n-back" x="584" y="332" width="352" height="120" rx="6"/>
  <text class="name" x="700" y="356" text-anchor="middle">Application</text>

  <rect id="platform-library" class="n-store" x="600" y="380" width="320" height="56" rx="6"/>
  <text class="name" x="760" y="404" text-anchor="middle">eh_os_contract</text>
  <text class="sub" x="760" y="422" text-anchor="middle">from eh-os-contract · the manifest · credentials</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="508" x2="960" y2="508"/>
  <text class="eyes" x="40" y="528">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="548" r="6"/>
  <text class="badget" x="46" y="551" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="552">ehosctl calls EHOS's API as the person signed in.</text>
  <circle class="badge" cx="46" cy="572" r="6"/>
  <text class="badget" x="46" y="575" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="576">The installation code installs a release of EHOS on a cluster.</text>
  <circle class="badge" cx="46" cy="596" r="6"/>
  <text class="badget" x="46" y="599" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="600">The application template makes a client's application.</text>
  <circle class="badge" cx="506" cy="548" r="6"/>
  <text class="badget" x="506" y="551" text-anchor="middle">4</text>
  <text class="keyt" x="520" y="552">The application submits its manifest, and its ehos.yaml, to EHOS.</text>
  <circle class="badge" cx="506" cy="572" r="6"/>
  <text class="badget" x="506" y="575" text-anchor="middle">5</text>
  <text class="keyt" x="520" y="576">EHOS issues credentials, which eh_os_contract checks.</text>
  <text class="keyt" x="520" y="600">ehos_design is a library of the console and of every application.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="624" x2="960" y2="624"/>
  <rect class="n-focal" x="40" y="640" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="649">EHOS</text>
  <rect class="n-back" x="120" y="640" width="14" height="10" rx="2"/>
  <text class="legt" x="140" y="649">A tool or an application</text>
  <rect class="n-store" x="300" y="640" width="14" height="10" rx="2"/>
  <text class="legt" x="320" y="649">A library inside another</text>
  <rect class="n-shared" x="490" y="640" width="14" height="10" rx="2"/>
  <text class="legt" x="510" y="649">A library of many</text>
  <line class="arr" x1="640" y1="645" x2="667" y2="645" marker-end="url(#platform-arrow)"/>
  <text class="legt" x="676" y="649">Hands over</text>
  <line class="uses" x1="770" y1="645" x2="798" y2="645"/>
  <text class="legt" x="806" y="649">Uses</text>
  </g>
</svg>
